<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Shelter</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#f97316'
                    },
                    borderRadius: {
                        none: '0px',
                        sm: '4px',
                        DEFAULT: '8px',
                        md: '12px',
                        lg: '16px',
                        xl: '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        full: '9999px',
                        button: '8px'
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-6">Register Your Shelter</h1>
        <form id="shelterForm" class="bg-white p-6 rounded-lg shadow-lg" enctype="multipart/form-data">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="ownerName" class="block text-sm font-medium text-gray-700">Owner Name</label>
                    <input type="text" id="ownerName" name="ownerName" class="form-input w-full border border-gray-300 rounded px-3 py-2" required>
                </div>
                <div>
                    <label for="shelterName" class="block text-sm font-medium text-gray-700">Shelter Name</label>
                    <input type="text" id="shelterName" name="shelterName" class="form-input w-full border border-gray-300 rounded px-3 py-2" required>
                </div>
                <div>
                    <label for="shelterWebsite" class="block text-sm font-medium text-gray-700">Shelter Website (Optional)</label>
                    <input type="url" id="shelterWebsite" name="shelterWebsite" class="form-input w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label for="contactDetails" class="block text-sm font-medium text-gray-700">Contact Details</label>
                    <input type="text" id="contactDetails" name="contactDetails" class="form-input w-full border border-gray-300 rounded px-3 py-2" required>
                </div>
            </div>
            <div class="mt-6">
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" name="description" class="form-input w-full border border-gray-300 rounded px-3 py-2" required></textarea>
            </div>
            <div class="mt-6">
                <label for="images" class="block text-sm font-medium text-gray-700">Upload Images</label>
                <input type="file" id="images" name="images" class="form-input w-full border border-gray-300 rounded px-3 py-2" multiple required>
            </div>
            <div class="mt-6">
                <button type="submit" class="w-full bg-primary text-white py-2 rounded-button font-medium hover:bg-primary/90">Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
