<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | PawfectMatch</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#f97316'
                    },
                    borderRadius: {
                        none: '0px',
                        sm: '4px',
                        DEFAULT: '8px',
                        md: '12px',
                        lg: '16px',
                        xl: '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        full: '9999px',
                        button: '8px'
                    }
                }
            }
        };
    </script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #chatMessages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 8px;
        }

        .me {
            text-align: right;
            color: blue;
        }

        .them {
            text-align: left;
            color: green;
        }
    </style>
</head>

<body class="bg-gray-50">
    <nav class="bg-white shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center">
                        <div class="w-10 h-10 flex items-center justify-center text-primary text-2xl">
                            🐾
                        </div>
                        <span class="ml-2 text-2xl text-gray-800 logo">PawfectMatch</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-6">Chat 🐾</h1>
        <div id="chatContainer" class="bg-white p-6 rounded-lg shadow-lg">
            <div id="chatMessages"></div>
        </div>
        <form id="messageForm" class="mt-6">
            <input type="text" id="messageInput" placeholder="Type your message..."
                class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none"
                required>
            <button type="submit"
                class="bg-primary text-white px-4 py-2 rounded-button font-medium hover:bg-primary/90 mt-4">Send</button>
        </form>
    </div>
    <script>
        const API_BASE = 'http://localhost:5000'; // backend port

        const urlParams = new URLSearchParams(window.location.search);
        let ownerId = urlParams.get('ownerId');
        let ownerName = urlParams.get('ownerName');

        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const token = localStorage.getItem('token');

        if (!ownerId || !ownerName) {
            ownerId = localStorage.getItem('ownerId');
            ownerName = localStorage.getItem('ownerName');
        } else {
            localStorage.setItem('ownerId', ownerId);
            localStorage.setItem('ownerName', ownerName);
        }

        const currentUserElement = document.getElementById('currentUser');
        const chatWithElement = document.getElementById('chatWith');

        if (!currentUserElement || !chatWithElement) {
            console.error('Missing elements: currentUser or chatWith');
        } else {
            currentUserElement.textContent = username;
            chatWithElement.textContent = ownerName + ` (${ownerId})`;
        }

        function loadMessages() {
            if (!ownerId) {
                console.error('Invalid ownerId. Cannot fetch messages.');
                return;
            }

            fetch(`${API_BASE}/api/chat/${ownerId}`, {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch messages');
                    }
                    return response.json();
                })
                .then(messages => {
                    chatMessages.innerHTML = '';
                    messages.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'message ' + (msg.sender === userId ? 'me' : 'them');
                        div.innerHTML = `<strong>${msg.sender === userId ? 'Me' : ownerName}:</strong> ${msg.content}`;
                        chatMessages.appendChild(div);
                    });
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                })
                .catch(error => {
                    console.error('Error loading messages:', error);
                });
        }

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const content = messageInput.value.trim();
            if (!content) return;

            const messageData = {
                sender: userId,
                receiver: ownerId,
                content
            };

            fetch(`${API_BASE}/api/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify(messageData)
            })
                .then(response => {
                    if (response.ok) {
                        messageInput.value = '';
                        const div = document.createElement('div');
                        div.className = 'message me';
                        div.innerHTML = `<strong>Me:</strong> ${content}`;
                        chatMessages.appendChild(div);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    } else {
                        console.error('Message failed to send.');
                    }
                })
                .catch(error => console.error('Error sending message:', error));
        });

        // Initial load
        loadMessages();
    </script>
</body>

</html>
