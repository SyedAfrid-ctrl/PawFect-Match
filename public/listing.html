<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List a Pet - PawfectMatch</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#f97316'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex justify-center items-center mb-8">
            <div class="w-16 h-16 flex items-center justify-center text-primary text-4xl">
                🐾
            </div>
            <span class="ml-4 text-4xl font-bold text-gray-800 logo" style="font-family: 'Pacifico', serif;">PawfectMatch</span>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 mb-6">List a Pet</h1>
        <form class="bg-white p-6 rounded-lg shadow-lg" id="petListingForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pet Name</label>
                    <input type="text" id="petName" placeholder="Enter pet name" class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                    <input type="number" id="petAge" placeholder="Enter pet age" class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Breed</label>
                    <input type="text" id="petBreed" placeholder="Enter pet breed" class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                    <input type="text" id="petLocation" placeholder="Enter location" class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none" required>
                </div>
            </div>
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="petDescription" placeholder="Enter pet description" class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none" rows="3"></textarea>
            </div>
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Upload Image</label>
                <input type="file" id="petImage" class="w-full border border-gray-300 rounded py-2 px-4 text-sm focus:ring-2 focus:ring-primary/20 focus:outline-none" accept="image/*" required>
            </div>
            <div class="mt-6">
                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-button font-medium hover:bg-primary/90">Submit</button>
            </div>
        </form>
        <div id="listingSuccess" class="hidden text-green-600 text-center mt-4">Pet listed successfully!</div>
        <div id="listingError" class="hidden text-red-600 text-center mt-4"></div>
    </div>
    <script>
        // Auth-based UI logic for listing page
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('token');
            const loginBtn = document.getElementById('loginNavBtn');
            const registerBtn = document.getElementById('registerNavBtn');
            const listingContainer = document.getElementById('listingContainer');
            if (!token) {
                // Hide the form and show a message
                if (listingContainer) {
                    listingContainer.innerHTML = '<div class="text-center text-red-600 font-semibold">You must be logged in to list a pet.</div>';
                }
            } else {
                if (loginBtn) loginBtn.style.display = 'none';
                if (registerBtn) registerBtn.style.display = 'none';
            }
        });
        document.getElementById('petListingForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('petName').value);
            formData.append('type', document.getElementById('petType').value);
            formData.append('age', document.getElementById('petAge').value);
            formData.append('gender', document.getElementById('petGender').value);
            formData.append('description', document.getElementById('petDescription').value);
            formData.append('location', document.getElementById('petLocation').value);
            formData.append('image', document.getElementById('petImage').files[0]);
            const token = localStorage.getItem('token');
            try {
                const res = await fetch('http://localhost:5000/api/pets', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                if (res.ok) {
                    document.getElementById('listingSuccess').classList.remove('hidden');
                    document.getElementById('listingError').classList.add('hidden');
                    document.getElementById('petListingForm').reset();
                    setTimeout(() => {
                        window.location.reload();
                    }, 1200);
                } else {
                    const data = await res.json();
                    document.getElementById('listingError').textContent = data.error || 'Failed to list pet.';
                    document.getElementById('listingError').classList.remove('hidden');
                    document.getElementById('listingSuccess').classList.add('hidden');
                }
            } catch (err) {
                document.getElementById('listingError').textContent = 'Server error. Please try again.';
                document.getElementById('listingError').classList.remove('hidden');
                document.getElementById('listingSuccess').classList.add('hidden');
            }
        });
    </script>
</body>

</html>
